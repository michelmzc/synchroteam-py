[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synchroteam_py"
version = "0.1.0"
description = "Python wrapper for Synchroteam API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Michel Muñoz", email = "michelmzco@gmail.com" }
]
dependencies = [
    "requests>=2.31",
    "tqdm>=4.66",
    "python-dateutil>=2.8",
    "python-dotenv>=1.0",   
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-requests",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["synchroteam_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["synchroteam_py"]
branch = true

[tool.coverage.xml]
output = "coverage.xml"